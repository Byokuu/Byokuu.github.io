<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genshin Impact API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top mb-4 custom-nav">
        <div class="container position-relative">
            <a class="navbar-brand fw-bold text-white m-0" href="#">GENSHIN IMPACT</a>

            <div class="d-none d-lg-block position-absolute top-50 start-50 translate-middle">
                <div class="d-flex align-items-center gap-2" style="width: 500px;">
                    <div class="input-group search-container">
                        <input type="text" id="uidInput" class="form-control bg-dark text-white border-secondary"
                            placeholder="Enter UID (e.g. 838949055)">
                        <button id="searchBtn" class="btn btn-primary px-4">Search UID</button>
                    </div>
                    <button id="clearSearch" class="btn btn-danger px-3 shadow-sm" title="Reset All">✕</button>
                </div>
            </div>

            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item d-lg-none my-3">
                        <div class="input-group">
                            <input type="text" id="uidInputMobile"
                                class="form-control bg-dark text-white border-secondary" placeholder="Enter UID">
                            <button id="searchBtnMobile" class="btn btn-primary">Search</button>
                        </div>
                    </li>
                    <li class="nav-item"><a class="nav-link text-primary fw-bold" href="https://github.com/Byokuu"
                            target="_blank">GitHub</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="explorer-section" class="header-section text-center">
            <div class="row justify-content-center mb-2">
                <div class="col-md-6 col-lg-5">
                    <div id="searchStatus" class="mt-0" style="min-height: 24px;"></div>
                </div>
            </div>

            <div id="playerHeader" class="d-none animate-fade-in">
                <div class="akasha-card p-3 rounded-4">
                    <div class="d-flex align-items-center flex-wrap flex-lg-nowrap">
                        <div class="akasha-avatar-wrapper position-relative me-3">
                            <div class="player-icon-container"
                                style="width: 80px; height: 80px; overflow: hidden; border-radius: 12px; border: 1px solid rgba(122, 162, 247, 0.3);">
                            </div>
                        </div>
                        <div class="text-start flex-grow-1">
                            <h4 id="headerTitle" class="mb-0 text-white fw-bold"></h4>
                            <small id="headerSubtitle" class="text-secondary text-uppercase"
                                style="font-size: 0.75rem; letter-spacing: 1px;"></small>
                        </div>
                        <div id="headerStats"
                            class="d-flex gap-2 flex-wrap justify-content-end ms-lg-auto mt-3 mt-lg-0"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="characterGallery" class="row g-3 justify-content-center mb-5 d-none"></div>

        <hr class="border-secondary opacity-25 my-3">

        <div id="database-section" class="text-center">
            <div class="mb-4">
                <h3 class="text-white-50 mb-3">Character Database</h3>
                <div class="d-flex justify-content-center gap-3">
                    <button id="loadBtn" class="btn btn-outline-primary btn-lg px-5 py-2 rounded-pill shadow-sm">
                        Load Random Character
                    </button>
                    <button id="resetAll" class="btn btn-danger btn-lg px-4 py-2 rounded-pill shadow-sm">
                        Reset
                    </button>
                </div>
            </div>
        </div>

        <div class="row justify-content-center pb-5">
            <div id="characterDisplay" class="col-12">
                <div id="characterCardSlot">
                    <div class="text-center py-5">
                        <p class="text-secondary fs-5">Search a UID or click Random to begin...</p>
                    </div>

                    <div id="contentCard" class="character-card d-none">
                        <div class="img-column">
                            <img id="charImg" src="" alt="Character Art">
                        </div>

                        <div class="text-column d-flex flex-column">
                            <ul class="nav nav-tabs px-4 pt-3" id="charTabs" role="tablist">
                                <li class="nav-item"><button class="nav-link active" id="profile-tab"
                                        data-bs-toggle="tab" data-bs-target="#profile">Profile</button></li>
                                <li class="nav-item"><button class="nav-link" id="skills-tab" data-bs-toggle="tab"
                                        data-bs-target="#skills">Skills</button></li>
                                <li class="nav-item"><button class="nav-link" id="passives-tab" data-bs-toggle="tab"
                                        data-bs-target="#passives">Passives</button></li>
                                <li class="nav-item"><button class="nav-link" id="consts-tab" data-bs-toggle="tab"
                                        data-bs-target="#consts">Constellations</button></li>
                            </ul>

                            <div class="card-body-scroll">
                                <div class="tab-content" id="charTabsContent">
                                    <div class="tab-pane fade show active" id="profile">
                                        <h2 id="charName" class="display-6 fw-bold name-white mb-1"></h2>
                                        <div id="charRarity" class="mb-2"></div>
                                        <p id="charTitle" class="text-secondary fst-italic mb-3"></p>
                                        <div class="mb-4">
                                            <span id="charVision" class="badge rounded-pill badge-vision me-2"></span>
                                            <span id="charWeapon" class="badge rounded-pill badge-weapon"></span>
                                        </div>
                                        <p id="charDesc" class="card-text text-light mb-4"></p>
                                        <div class="row g-3">
                                            <div class="col-6">
                                                <p class="mb-1 section-header text-primary"
                                                    style="font-size: 0.8rem; text-transform: uppercase;">Nation</p>
                                                <p id="charNation" class="fw-bold"></p>
                                            </div>
                                            <div class="col-6">
                                                <p class="mb-1 section-header text-primary"
                                                    style="font-size: 0.8rem; text-transform: uppercase;">Affiliation
                                                </p>
                                                <p id="charAffiliation" class="text-light"></p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" id="skills">
                                        <div id="skillsContainer"></div>
                                    </div>
                                    <div class="tab-pane fade" id="passives">
                                        <div id="passivesContainer"></div>
                                    </div>
                                    <div class="tab-pane fade" id="consts">
                                        <div id="constsContainer"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="alertModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary shadow-lg" style="border-radius: 15px;">
                <div class="modal-header border-bottom border-secondary border-opacity-25">
                    <h5 class="modal-title text-primary fw-bold">Akasha System Notice</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body py-4 text-center">
                    <p id="modalMessage" class="fs-5 mb-0"></p>
                </div>
                <div class="modal-footer border-top border-secondary border-opacity-25">
                    <button type="button" class="btn btn-primary px-4 rounded-pill"
                        data-bs-dismiss="modal">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
