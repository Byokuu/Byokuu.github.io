<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GenshinDex | Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="CSS/index.css" rel="stylesheet">
</head>

<body class="dashboard-bg bg-black text-white">

    <nav class="navbar py-4">
        <div class="container-fluid px-5 d-flex justify-content-between align-items-center">

            <a class="navbar-brand fw-bold dex-logo fs-2 m-0">GENSHIN IMPACT</a>

            <div class="d-flex flex-column align-items-center position-absolute start-50 translate-middle-x">
                <div class="d-flex align-items-center gap-2">
                    <input type="text" id="uidInput" class="form-control bg-dark border-secondary text-white"
                        placeholder="Enter UID..." style="width: 300px;">

                    <button id="searchBtn" class="btn btn-primary fw-bold px-4" onclick="fetchByUid()">
                        Search UID
                    </button>

                    <button id="clearSearch" class="btn btn-danger px-3" onclick="performFullReset()">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div id="searchStatus" class="mt-2" style="height: 20px;"></div>
            </div>

            <a href="https://github.com/Byokuu" class="text-secondary text-decoration-none small fw-bold">GITHUB</a>

        </div>
    </nav>

    <div class="container py-5">

        <div id="playerHeader" class="mb-5 d-none">
            <div class="akasha-card p-4 rounded-4">
                <div class="row align-items-center">

                    <div class="col d-flex align-items-center gap-3">
                        <div class="player-icon-container"></div>
                        <div>
                            <h2 id="headerTitle" class="text-white fw-bold m-0"></h2>
                            <p id="headerSubtitle" class="text-secondary small m-0"></p>
                        </div>
                    </div>

                    <div class="col-auto">
                        <div id="headerStats" class="d-flex flex-wrap gap-2 justify-content-end"></div>
                    </div>

                </div>
            </div>
        </div>

        <hr class="border-secondary border-opacity-25 mb-5">

        <div id="selectionHub">
            <h1 class="text-center mb-5 display-4 fw-bold text-uppercase" style="letter-spacing: 4px;">Database Index
            </h1>

            <div class="row g-4 justify-content-center">
                <div class="col-md-3">
                    <a href="HTML/character.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-users display-1 mb-3"></i>
                        <span class="card-label">Characters</span>
                    </a>
                </div>

                <div class="col-md-3">
                    <a href="HTML/weapons.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-khanda display-1 mb-3"></i>
                        <span class="card-label">Weapons</span>
                    </a>
                </div>

                <div class="col-md-3">
                    <a href="HTML/artifacts.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-clover display-1 mb-3"></i>
                        <span class="card-label">Artifacts</span>
                    </a>
                </div>  

                <div class="col-md-3">
                    <a href="HTML/enemies.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-skull display-1 mb-3"></i>
                        <span class="card-label">Enemies</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="alertModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-body p-4 text-center">
                    <p id="modalMessage" class="mb-0"></p>
                    <button type="button" class="btn btn-info mt-3" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="SCRIPT/index.js"></script>
</body>

</html>
