<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GenshinDex | Weekly Bosses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/style.css" rel="stylesheet">
</head>

<body id="body" class="dashboard-bg">
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12 col-lg-3 mb-4 mb-lg-0">
                <div class="search-panel p-4">
                    <h2 class="dex-logo text-center mb-4">GenshinDex</h2>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase">Boss Name</label>
                        <input type="text" id="nameSearch" class="form-control custom-input"
                            placeholder="Search weekly boss...">
                    </div>
                    <div class="d-flex gap-2">
                        <button id="clearBtn" class="btn btn-clear flex-grow-1">Clear</button>
                        <button id="searchBtn" class="btn btn-search flex-grow-1">Search</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-9">
                <nav class="sticky-top-nav d-flex justify-content-between align-items-center p-4 mb-4">
                    <h2 class="panel-title m-0">WEEKLY BOSSES</h2>
                    <a href="../portal.html" class="btn btn-home text-decoration-none">Back to Portal</a>
                </nav>

                <div class="content-panel px-4 pb-4">
                    <div id="bossList" class="dex-list d-flex flex-column gap-3">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="bossDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content character-dashboard border-0">
                <div class="p-4 d-flex justify-content-between align-items-start">
                    <h2 id="bossName" class="fw-bold m-0 text-white display-6"></h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="p-4 pt-0">
                    <div class="row g-4">
                        <div class="col-md-5 border-end border-secondary border-opacity-25">
                            <label class="stats-label">Description</label>
                            <p id="bossDesc" class="text-white-50 small lh-lg" style="text-align: justify;"></p>
                        </div>
                        <div class="col-md-7">
                            <div class="mb-4">
                                <label class="stats-label mb-2">Unique Drops</label>
                                <div id="dropsContainer" class="d-flex flex-wrap gap-2 pe-2 custom-scroll"
                                    style="max-height: 180px; overflow-y: auto;"></div>
                            </div>
                            <div>
                                <label class="stats-label mb-2">Artifact Sets</label>
                                <div id="artifactsContainer" class="d-flex flex-wrap gap-2"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../SCRIPT/theme.js"></script>
    <script src="../SCRIPT/bosses.js"></script>
</body>

</html>
