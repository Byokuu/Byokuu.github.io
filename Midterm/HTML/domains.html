<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GenshinDex | Domains</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/style.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12 col-lg-3 mb-4 mb-lg-0">
                <div class="search-panel p-4">
                    <h2 class="dex-logo text-center mb-4">GenshinDex</h2>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Domain Name</label>
                        <input type="text" id="nameSearch" class="form-control custom-input"
                            placeholder="Search domain...">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Nation</label>
                        <select id="nationFilter" class="form-select custom-input">
                            <option value="">All Nations</option>
                            <option value="Mondstadt">Mondstadt</option>
                            <option value="Liyue">Liyue</option>
                            <option value="Inazuma">Inazuma</option>
                            <option value="Sumeru">Sumeru</option>
                            <option value="Fontaine">Fontaine</option>
                            <option value="Natlan">Natlan</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button id="clearBtn" class="btn btn-clear flex-grow-1">Clear</button>
                        <button id="searchBtn" class="btn btn-search flex-grow-1">Search</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-9">
                <nav class="sticky-top-nav d-flex justify-content-between align-items-center p-4 mb-4">
                    <h2 class="panel-title m-0">Genshin Domains</h2>
                    <a href="../portal.html" class="btn btn-home text-decoration-none">Back to Portal</a>
                </nav>

                <div class="content-panel px-4 pb-4">
                    <div id="domainList" class="dex-list d-flex flex-column gap-3">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="domainDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content character-dashboard border-0">
                <div class="p-4 d-flex justify-content-between align-items-start">
                    <div>
                        <h2 id="domainName" class="fw-bold m-0 text-white display-6"></h2>
                        <p id="domainNation" class="text-info mb-0"></p>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="p-4 pt-0">
                    <div class="row g-4">
                        <div class="col-md-6 border-end border-secondary border-opacity-25">
                            <label class="stats-label">Location</label>
                            <p id="domainLocation" class="stats-value small mb-3"></p>

                            <label class="stats-label">Description</label>
                            <p id="domainDesc" class="text-white-50 small lh-lg mb-3"></p>

                            <label class="stats-label">Recommended Elements</label>
                            <div id="elementContainer" class="d-flex gap-2 mt-2"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="stats-label">Requirements & Rewards</label>
                            <div id="requirementsContainer" class="mt-2 overflow-auto" style="max-height: 200px;"></div>
                            <div id="rewardContainer" class="mt-3 pt-3 border-top border-secondary border-opacity-25">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../SCRIPT/theme.js"></script>
    <script src="../SCRIPT/domains.js"></script>
</body>

</html>
