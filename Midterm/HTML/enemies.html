<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GenshinDex | Enemies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/style.css" rel="stylesheet">
</head>

<body id="body" class="dashboard-bg">
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12 col-lg-3 mb-4 mb-lg-0">
                <div class="search-panel p-4">
                    <h2 class="dex-logo text-center mb-4">GenshinDex</h2>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Enemy Name</label>
                        <input type="text" id="nameSearch" class="form-control custom-input"
                            placeholder="Search enemy...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Enemy Type</label>
                        <select id="typeFilter" class="form-select custom-input">
                            <option value="">All Types</option>
                            <option value="Common Enemies">Common Enemies</option>
                            <option value="Elite Enemies">Elite Enemies</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Family</label>
                        <select id="familyFilter" class="form-select custom-input">
                            <option value="">All Families</option>
                            <option value="Slime">Slime</option>
                            <option value="Hilichurls">Hilichurls</option>
                            <option value="Fatui">Fatui</option>
                            <option value="Automatons">Automatons</option>
                            <option value="The Abyss">Abyss Order</option>
                            <option value="Elemental Lifeforms">Elemental Lifeforms</option>
                            <option value="Mystical Beasts">Mystical Beasts</option>
                            <option value="Treasure Hoarders">Treasure Hoarder</option>
                            <option value="Unique Enemies">Unique Enemies</option>
                            <option value="Other Human Factions">Human Factions</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="clearBtn" class="btn btn-clear flex-grow-1">Clear</button>
                        <button id="searchBtn" class="btn btn-search flex-grow-1">Search</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-9">
                <nav class="sticky-top-nav d-flex justify-content-between align-items-center p-4 mb-4">
                    <h2 class="panel-title m-0">Genshin Enemies</h2>
                    <a href="../portal.html" class="btn btn-home text-decoration-none">Back to Portal</a>
                </nav>
                <div class="content-panel px-4 pb-4">
                    <div id="enemyList" class="dex-list d-flex flex-column gap-3"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="enemyDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div id="modalContent" class="modal-content character-dashboard border-0">
                <div class="row g-0">
                    <div class="col-md-4 bg-black d-flex align-items-stretch overflow-hidden">
                        <img id="enemyImg" src="" class="img-fluid w-100" style="object-fit: cover;" alt="Enemy Art">
                    </div>

                    <div class="col-md-8 d-flex flex-column dashboard-bg">
                        <div class="p-4 pb-0 d-flex justify-content-between align-items-start">
                            <div>
                                <h2 id="enemyName" class="fw-bold m-0 text-white display-5"></h2>
                                <p id="enemyType" class="text-info mb-0 text-uppercase letter-spacing-2 small"></p>
                            </div>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="row g-0 flex-grow-1">
                            <div class="col-md-4 p-4 border-end border-secondary border-opacity-25">
                                <div class="info-item mb-4">
                                    <label class="stats-label">Family</label>
                                    <p id="enemyFamily" class="stats-value"></p>
                                </div>
                                <div class="info-item mb-4">
                                    <label class="stats-label">Faction</label>
                                    <p id="enemyFaction" class="stats-value"></p>
                                </div>
                                <div class="info-item">
                                    <label class="stats-label">Elements</label>
                                    <div id="enemyElements" class="d-flex flex-wrap gap-1 mt-2"></div>
                                </div>
                            </div>

                            <div class="col-md-8 d-flex flex-column">
                                <ul class="nav mb-3 px-3 bg-black bg-opacity-25" id="enemyTabs" role="tablist">
                                    <li class="nav-item">
                                        <button class="nav-link active" data-bs-toggle="tab"
                                            data-bs-target="#profile">Profile</button>
                                    </li>
                                    <li class="nav-item">
                                        <button class="nav-link" data-bs-toggle="tab"
                                            data-bs-target="#elementsTab">Elements</button>
                                    </li>
                                    <li class="nav-item">
                                        <button class="nav-link" data-bs-toggle="tab"
                                            data-bs-target="#drops">Drops</button>
                                    </li>
                                </ul>

                                <div class="tab-content p-4 flex-grow-1 overflow-auto" style="max-height: 450px;">
                                    <div class="tab-pane fade show active" id="profile">
                                        <h6 class="text-info text-uppercase letter-spacing-2 mb-2"
                                            style="font-size: 0.7rem;">Description</h6>
                                        <p id="enemyDesc" class="text-white-50 lh-lg"></p>
                                    </div>

                                    <div class="tab-pane fade" id="elementsTab">
                                        <h6 class="text-info text-uppercase letter-spacing-2 mb-3"
                                            style="font-size: 0.7rem;">Elemental Affiliations</h6>
                                        <div id="enemyElementsContainer" class="d-flex flex-wrap gap-2"></div>
                                    </div>

                                    <div class="tab-pane fade" id="drops">
                                        <div id="dropsContainer"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../SCRIPT/theme.js"></script>
    <script src="../SCRIPT/enemies.js"></script>
</body>

</html>
