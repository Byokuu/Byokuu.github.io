<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GenshinDex | Characters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/style.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12 col-lg-3 mb-4 mb-lg-0">
                <div class="search-panel p-4">
                    <h2 class="dex-logo text-center mb-4">GenshinDex</h2>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Name</label>
                        <input type="text" id="nameSearch" class="form-control custom-input"
                            placeholder="Search name...">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Element</label>
                        <select id="elementFilter" class="form-select custom-input">
                            <option value="">All Elements</option>
                            <option value="pyro">Pyro</option>
                            <option value="hydro">Hydro</option>
                            <option value="anemo">Anemo</option>
                            <option value="electro">Electro</option>
                            <option value="dendro">Dendro</option>
                            <option value="cryo">Cryo</option>
                            <option value="geo">Geo</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Weapon Type</label>
                        <select id="weaponFilter" class="form-select custom-input">
                            <option value="">All Weapons</option>
                            <option value="sword">Sword</option>
                            <option value="claymore">Claymore</option>
                            <option value="polearm">Polearm</option>
                            <option value="bow">Bow</option>
                            <option value="catalyst">Catalyst</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button id="clearBtn" class="btn btn-clear flex-grow-1">Clear</button>
                        <button id="searchBtn" class="btn btn-search flex-grow-1">Search</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-9">
                <nav class="sticky-top-nav d-flex justify-content-between align-items-center p-4 mb-4">
                    <h2 class="panel-title m-0">Genshin Characters</h2>
                    <a href="../portal.html" class="btn btn-home text-decoration-none">Back to Portal</a>
                </nav>

                <div class="content-panel px-4 pb-4">
                    <div id="characterList" class="dex-list d-flex flex-column gap-3">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div id="modalContent" class="modal-content character-dashboard border-0">
                <div class="row g-0">
                    <div class="col-md-4 bg-black d-flex align-items-stretch">
                        <img id="charImg" src="" class="img-fluid w-100" style="object-fit: cover;" alt="Character Art">
                    </div>

                    <div class="col-md-8 d-flex flex-column dashboard-bg">

                        <div class="p-4 pb-0 d-flex justify-content-between align-items-start">
                            <div>
                                <h2 id="charName" class="fw-bold m-0 text-white display-5"></h2>
                                <p id="charRarity" class="text-warning mb-0 fs-4"></p>
                            </div>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="row g-0 flex-grow-1">
                            <div class="col-md-4 p-4 border-end border-secondary border-opacity-25">
                                <div class="info-item mb-4">
                                    <label class="stats-label">Nation</label>
                                    <p id="charNation" class="stats-value"></p>
                                </div>
                                <div class="info-item mb-4">
                                    <label class="stats-label">Affiliation</label>
                                    <p id="charAffiliation" class="stats-value"></p>
                                </div>
                                <div class="d-flex flex-column gap-2 mt-auto">
                                    <div id="charVision" class="badge-vision-container"></div>
                                    <div id="charWeapon" class="badge-weapon-container"></div>
                                </div>
                            </div>

                            <div class="col-md-8 d-flex flex-column">
                                <ul class="nav nav-tabs px-3 border-0 bg-black bg-opacity-25" id="charTabs"
                                    role="tablist">
                                    <li class="nav-item"><button class="nav-link active text-white" data-bs-toggle="tab"
                                            data-bs-target="#profile">Profile</button></li>
                                    <li class="nav-item"><button class="nav-link text-white" data-bs-toggle="tab"
                                            data-bs-target="#skills">Skills</button></li>
                                    <li class="nav-item"><button class="nav-link text-white" data-bs-toggle="tab"
                                            data-bs-target="#passives">Passives</button></li>
                                    <li class="nav-item"><button class="nav-link text-white" data-bs-toggle="tab"
                                            data-bs-target="#consts">Constellations</button></li>
                                </ul>

                                <div class="tab-content p-4 flex-grow-1 overflow-auto" style="max-height: 450px;">
                                    <div class="tab-pane fade show active" id="profile">
                                        <p id="charDesc" class="text-white-50 lh-lg"></p>
                                    </div>
                                    <div class="tab-pane fade" id="skills">
                                        <div id="skillsContainer"></div>
                                    </div>
                                    <div class="tab-pane fade" id="passives">
                                        <div id="passivesContainer"></div>
                                    </div>
                                    <div class="tab-pane fade" id="consts">
                                        <div id="constsContainer"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../SCRIPT/theme.js"></script>
    <script src="../SCRIPT/character.js"></script>
</body>

</html>
