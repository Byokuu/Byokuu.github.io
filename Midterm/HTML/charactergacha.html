<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Wish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/gacha.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg py-3">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand fw-bold dex-logo fs-2 m-0" href="../index.html">GENSHIN IMPACT</a>
            <div class="ms-auto"><a href="../index.html" class="btn-home">Home</a></div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-4">
            <h5 id="featured4Stars" class="text-warning fw-bold uppercase tracking-widest">Rate Up: Loading...</h5>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="akasha-card p-5 text-center h-100"
                    style="background: linear-gradient(rgba(17, 21, 28, 0.85), rgba(17, 21, 28, 0.85)), url('../assets/char-bg.jpg'); background-size: cover;">
                    <h2 id="featuredName" class="display-6 fw-bold mb-3 text-white">CHARACTER 1</h2>
                    <p class="text-secondary tracking-widest mb-4 uppercase">Phase 1 Event Wish</p>

                    <div class="d-flex justify-content-center gap-3 mb-5">
                        <div class="akasha-stat-badge">5★ PITY: <span id="pity5Count">0</span>/90</div>
                    </div>

                    <div class="d-flex justify-content-center gap-2">
                        <button class="btn btn-primary fw-bold" onclick="handleGachaPull('character', false)">WISH
                            x1</button>
                        <button class="btn btn-primary fw-bold" onclick="handleGachaPull('character', true)"
                            style="background-color: #7aa2f7;">WISH x10</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="akasha-card p-5 text-center h-100"
                    style="background: linear-gradient(rgba(17, 21, 28, 0.85), rgba(17, 21, 28, 0.85)), url('../assets/char-bg.jpg'); background-size: cover;">
                    <h2 id="featuredName2" class="display-6 fw-bold mb-3 text-white">CHARACTER 2</h2>
                    <p class="text-secondary tracking-widest mb-4 uppercase">Phase 2 Event Wish</p>

                    <div class="d-flex justify-content-center gap-3 mb-5">
                        <div class="akasha-stat-badge">4★ PITY: <span id="pity4Count">0</span>/10</div>
                    </div>

                    <div class="d-flex justify-content-center gap-2">
                        <button class="btn btn-primary fw-bold" onclick="handleGachaPull('character2', false)">WISH
                            x1</button>
                        <button class="btn btn-primary fw-bold" onclick="handleGachaPull('character2', true)"
                            style="background-color: #7aa2f7;">WISH x10</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="wishResults" class="row g-3 justify-content-center mt-5"></div>
    </div>

    <script src="../SCRIPT/gachalogic.js"></script>
</body>

</html>
