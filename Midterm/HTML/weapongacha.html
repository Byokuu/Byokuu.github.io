<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weapon Wish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="../CSS/gacha.css" rel="stylesheet">
</head>

<body id="body">
    <div id="wishOverlay" class="wish-overlay d-none">
        <div class="wish-star-container">
            <div id="starStreak" class="star-streak"></div>
        </div>
    </div>
    
    <nav class="navbar navbar-expand-lg py-3">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand fw-bold dex-logo fs-2 m-0">GENSHIN IMPACT</a>
            <div class="ms-auto"><a href="../portal.html" class="btn-home">Back to Portal</a></div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="akasha-card p-5 text-center mb-5"
            style="background: linear-gradient(rgba(17, 21, 28, 0.9), rgba(17, 21, 28, 0.9)), url('../assets/weapon-bg.jpg'); background-size: cover;">
            <h1 class="display-4 fw-bold mb-3">EPITOME INVOCATION</h1>

            <p id="featuredName" class="text-warning tracking-widest mb-4 uppercase fw-bold">Loading Weapon...</p>

            <p class="text-secondary tracking-widest mb-4 uppercase">Weapon Event Wish</p>

            <div class="d-flex justify-content-center gap-3 mb-5">
                <div class="akasha-stat-badge">5★ PITY: <span id="pity5Count">0</span>/80</div>
                <div class="akasha-stat-badge">4★ PITY: <span id="pity4Count">0</span>/10</div>
            </div>

            <div class="d-flex justify-content-center gap-4">
                <button class="btn btn-primary btn-lg fw-bold px-5" onclick="handleGachaPull('weapon', false)">WISH
                    x1</button>
                <button class="btn btn-primary btn-lg fw-bold px-5" onclick="handleGachaPull('weapon', true)"
                    style="background-color: #7aa2f7;">WISH x10</button>
            </div>
        </div>
        <div id="wishResults" class="row g-3 justify-content-center"></div>
    </div>

    <script src="../SCRIPT/theme.js"></script>
    <script src="../SCRIPT/gachalogic.js"></script>
</body>

</html>
