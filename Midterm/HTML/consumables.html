<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GenshinDex | Consumables</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/style.css" rel="stylesheet">
</head>

<body class="dashboard-bg">
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12 col-lg-3 mb-4 mb-lg-0">
                <div class="search-panel p-4">
                    <h2 class="dex-logo text-center mb-4">GenshinDex</h2>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Item Name</label>
                        <input type="text" id="nameSearch" class="form-control custom-input"
                            placeholder="Search item...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Category</label>
                        <select id="typeFilter" class="form-select custom-input">
                            <option value="">All Items</option>
                            <option value="Food">Food</option>
                            <option value="Potion">Potions</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="clearBtn" class="btn btn-clear flex-grow-1">Clear</button>
                        <button id="searchBtn" class="btn btn-search flex-grow-1">Search</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-9">
                <nav class="sticky-top-nav d-flex justify-content-between align-items-center p-4 mb-4">
                    <h2 class="panel-title m-0">Genshin Consumables</h2>
                    <a href="../index.html" class="btn btn-home text-decoration-none">Home</a>
                </nav>
                <div class="content-panel px-4 pb-4">
                    <div id="consumableList" class="dex-list d-flex flex-column gap-3"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="consumableDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div id="modalContent" class="modal-content character-dashboard border-0">
                <div class="row g-0">
                    <div class="col-md-4 bg-black d-flex align-items-center justify-content-center p-4">
                        <img id="itemImg" src="" class="img-fluid" style="max-height: 300px;" alt="Item Art">
                    </div>

                    <div class="col-md-8 d-flex flex-column dashboard-bg">
                        <div class="p-4 pb-0 d-flex justify-content-between align-items-start">
                            <div>
                                <h2 id="itemName" class="fw-bold m-0 text-white display-5"></h2>
                                <p id="itemRarity" class="text-warning mb-0 fs-4"></p>
                            </div>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="row g-0 flex-grow-1">
                            <div class="col-md-4 p-4 border-end border-secondary border-opacity-25">
                                <div class="info-item mb-4">
                                    <label class="stats-label">Type</label>
                                    <p id="itemType" class="stats-value text-info"></p>
                                </div>
                                <div class="info-item mb-4">
                                    <label class="stats-label">Effect</label>
                                    <p id="itemEffect" class="stats-value small"></p>
                                </div>
                            </div>

                            <div class="col-md-8 d-flex flex-column">
                                <ul class="nav mb-3 px-3 bg-black bg-opacity-25" id="consumableTabs" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link active" data-bs-toggle="tab"
                                            data-bs-target="#description" type="button" role="tab">Details</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#recipe"
                                            type="button" role="tab">Recipe / Sources</button>
                                    </li>
                                </ul>

                                <div class="tab-content p-4 flex-grow-1 overflow-auto" style="max-height: 450px;">
                                    <div class="tab-pane fade show active" id="description" role="tabpanel">
                                        <h6 class="text-info small fw-bold mb-2">Description</h6>
                                        <p id="itemDesc" class="text-white-50 lh-lg"></p>
                                        <div id="proficencyContainer" class="mt-3"></div>
                                    </div>
                                    <div class="tab-pane fade" id="recipe" role="tabpanel">
                                        <div id="recipeContainer"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../SCRIPT/consumables.js"></script>
</body>

</html>
