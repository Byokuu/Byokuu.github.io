<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard Wish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/gacha.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg py-3">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand fw-bold dex-logo fs-2 m-0" href="../index.html">GENSHIN IMPACT</a>
            <div class="ms-auto"><a href="../index.html" class="btn-home">Home</a></div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="akasha-card p-5 text-center mb-5"
            style="background: linear-gradient(rgba(17, 21, 28, 0.9), rgba(17, 21, 28, 0.9)), url('../assets/standard-bg.jpg'); background-size: cover;">
            <h1 class="display-4 fw-bold mb-3">WANDERLUST INVOCATION</h1>
            <p class="text-secondary tracking-widest mb-4 uppercase">Standard Wish</p>

            <div class="d-flex justify-content-center gap-3 mb-5">
                <div class="akasha-stat-badge" style="border-color: #7aa2f7; color: #7aa2f7;">
                    5★ PITY: <span id="pity5Count">0</span>/90
                </div>
                <div class="akasha-stat-badge" style="border-color: #7aa2f7; color: #7aa2f7;">
                    4★ PITY: <span id="pity4Count">0</span>/10
                </div>
            </div>

            <div class="d-flex justify-content-center gap-4">
                <button class="btn btn-primary btn-lg fw-bold px-5" onclick="handleGachaPull('standard', false)">
                    WISH x1
                </button>
                <button class="btn btn-primary btn-lg fw-bold px-5" onclick="handleGachaPull('standard', true)">
                    WISH x10
                </button>
            </div>
        </div>
        <div id="wishResults" class="row g-3 justify-content-center"></div>
    </div>

    <script src="../SCRIPT/gachalogic.js"></script>
</body>

</html>
