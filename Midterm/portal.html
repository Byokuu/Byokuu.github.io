<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GenshinDex | Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="CSS/portal.css" rel="stylesheet">
</head>

<body id="body" class="dashboard-bg bg-black text-white">

    <nav class="navbar navbar-expand-lg py-3">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand fw-bold dex-logo fs-2 m-0" href="#">GENSHIN IMPACT</a>

            <button class="navbar-toggler border-secondary" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSearchContent">
                <i class="fa-solid fa-bars text-white"></i>
            </button>

            <div class="collapse navbar-collapse" id="navbarSearchContent">
                <div
                    class="d-flex flex-column flex-lg-row w-100 align-items-center justify-content-center justify-content-lg-end">

                    <div class="search-container-wrapper ms-lg-auto mt-2 mt-lg-0">
                        <div class="uid-group d-flex flex-column flex-lg-row align-items-center gap-3">

                            <div class="d-flex align-items-center gap-2 order-2 order-lg-1">
                                <input type="text" id="uidInput"
                                    class="form-control bg-dark border-secondary text-white uid-field"
                                    placeholder="UID..." style="width: 200px;">
                                <button id="searchBtn" class="btn btn-primary fw-bold" onclick="fetchByUid()">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </button>
                                <button id="clearSearch" class="btn btn-danger" onclick="performFullReset()">
                                    &times;
                                </button>
                            </div>

                            <div class="d-flex align-items-center gap-3 order-1 order-lg-2">
                                <a href="https://github.com/Byokuu"
                                    class="text-secondary text-decoration-none small fw-bold hover-white">GITHUB</a>
                                <a href="index.html"
                                    class="text-secondary text-decoration-none small fw-bold hover-white">HOME</a>
                                <button id="theme-toggle"
                                    class="btn btn-outline-warning rounded-pill px-3 d-flex align-items-center gap-2">
                                    <i class="fa-solid fa-moon"></i>
                                    <span class="theme-text small fw-bold">Light Mode</span>
                                </button>
                            </div>
                        </div>

                        <div id="searchStatus" class="mt-2 text-center w-100"
                            style="font-size: 0.75rem; min-height: 20px; color: #7aa2f7;"></div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div id="playerHeader" class="mb-5 d-none">
            <div class="akasha-card p-4 rounded-4">
                <div class="row align-items-center">
                    <div class="col d-flex align-items-center gap-3">
                        <div class="player-icon-container"></div>
                        <div>
                            <h2 id="headerTitle" class="text-white fw-bold m-0"></h2>
                            <p id="headerSubtitle" class="text-secondary small m-0"></p>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div id="headerStats" class="d-flex flex-wrap gap-2 justify-content-end"></div>
                    </div>
                </div>
            </div>
        </div>

        <hr class="border-secondary border-opacity-25 mb-5">

        <div id="selectionHub" class="mb-5">
            <h1 class="text-center mb-5 display-4 fw-bold text-uppercase" style="letter-spacing: 4px;">Database Index
            </h1>
            <div class="row g-4 justify-content-center">
                <div class="col-md-3">
                    <a href="HTML/character.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-users display-1 mb-3"></i>
                        <span class="card-label">Characters</span>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="HTML/weapons.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-khanda display-1 mb-3"></i>
                        <span class="card-label">Weapons</span>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="HTML/artifacts.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-clover display-1 mb-3"></i>
                        <span class="card-label">Artifacts</span>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="HTML/enemies.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-skull display-1 mb-3"></i>
                        <span class="card-label">Enemies</span>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="HTML/consumables.html"
                        class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-utensils display-1 mb-3"></i>
                        <span class="card-label">Consumables</span>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="HTML/materials.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-toolbox display-1 mb-3"></i>
                        <span class="card-label">Materials</span>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="HTML/domains.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-archway display-1 mb-3"></i>
                        <span class="card-label">Domains</span>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="HTML/bosses.html" class="card h-100 text-decoration-none category-card p-5 text-center">
                        <i class="fa-solid fa-dragon display-1 mb-3"></i>
                        <span class="card-label">Weekly Bosses</span>
                    </a>
                </div>
            </div>
        </div>

        <hr class="border-secondary border-opacity-25 my-5">

        <div id="gachaHub" class="container py-5">
            <h1 class="text-center mb-5 display-4 fw-bold text-uppercase">Gacha Simulation</h1>

            <div class="row g-4 justify-content-center">
                <div class="col-md-4">
                    <a href="HTML/charactergacha.html"
                        class="card category-card h-100 text-decoration-none p-4 text-center event-banner">
                        <div class="banner-tag">Event Wish</div>
                        <i class="fa-solid fa-person-rays display-3 mb-3 text-warning"></i>
                        <span class="card-label">Character Event</span>
                        <p class="text-secondary small mt-2">Stellar Reunion</p>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="HTML/weapongacha.html"
                        class="card category-card h-100 text-decoration-none p-4 text-center weapon-banner">
                        <div class="banner-tag">Event Wish</div>
                        <i class="fa-solid fa-wand-magic-sparkles display-3 mb-3 text-info"></i>
                        <span class="card-label">Epitome Invocation</span>
                        <p class="text-secondary small mt-2">Weapon Event Wish</p>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="HTML/standardgacha.html"
                        class="card category-card h-100 text-decoration-none p-4 text-center standard-banner">
                        <div class="banner-tag bg-secondary">Permanent</div>
                        <i class="fa-solid fa-star display-3 mb-3 text-light"></i>
                        <span class="card-label">Wanderlust Invocation</span>
                        <p class="text-secondary small mt-2">Standard Wish</p>
                    </a>
                </div>
            </div>
        </div>

    </div>

    <div class="modal fade" id="alertModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-body p-4 text-center">
                    <p id="modalMessage" class="mb-0"></p>
                    <button type="button" class="btn btn-info mt-3" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="SCRIPT/theme.js"></script>
    <script src="SCRIPT/portal.js"></script>
</body>

</html>
